version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: redot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-redot}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-redot}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Django
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: redot-backend
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: redot.redot.settings
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-redot}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - redot-network
    # Rodar migrações antes do Gunicorn
    command: >-
      sh -c "python manage.py migrate && 
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 redot.redot.wsgi:application"

  # Frontend Vue + Nginx (estático)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Preferir roteamento via Nginx para evitar CORS
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: redot-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - redot-network

  # Nginx como reverse proxy principal
  nginx:
    image: nginx:alpine
    container_name: redot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - redot-network

networks:
  redot-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local